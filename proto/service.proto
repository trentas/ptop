syntax = "proto3";

package ptop.v1;

import "event.proto";

option go_package = "github.com/trentas/ptop/pkg/streampb;streampb";

// SubscribeRequest opens a stream. categories filters which Event categories
// the server sends; empty means all.
//
// pid names the process to observe (#72). It is required when the server was
// started without a target (`ptop --serve` with no `--pid`/`--cgroup`), which
// serves targets on demand: the collectors for a pid start with its first
// subscriber and stop with its last. When the server WAS started with a fixed
// target, pid must be 0 or that exact pid — anything else is rejected rather
// than silently served the wrong process. Either way the server reports what it
// is actually observing in the TargetInfo handshake.
message SubscribeRequest {
  repeated Category categories = 1;
  int32 pid = 2;
}

// TargetMode is how the server was told what to observe (#94).
enum TargetMode {
  TARGET_MODE_UNSPECIFIED = 0;
  // One process, matched by pid inside its own pid namespace.
  TARGET_MODE_PID = 1;
  // Every process in a cgroup subtree, matched by cgroup id. No pid is
  // involved, so the subtree's forks are included automatically.
  TARGET_MODE_CGROUP = 2;
}

// TargetInfo describes the SCOPE of everything on this stream. The server sends
// it once, in the first StreamMeta of a subscription, before any event.
//
// It matters because the two modes aggregate differently. In PID mode every
// Event.pid is the target. In CGROUP mode events come from any process in the
// subtree, so Event.pid is 0 on the aggregate payloads (there is no single
// process to name) and any pid inside a payload is a ROOT-namespace pid — a
// subtree can span pid namespaces, so there is no namespace to project into.
message TargetInfo {
  TargetMode mode = 1;
  // PID mode: the target pid. 0 in cgroup mode.
  int32 pid = 2;
  // CGROUP mode: the resolved absolute cgroup path, and the cgroup id it
  // resolved to (the directory inode). Empty/0 in pid mode.
  string cgroup_path = 3;
  uint64 cgroup_id = 4;
}

// StreamMeta is an out-of-band signal interleaved in the stream. It carries the
// subscription handshake (target, sent once before any event) and reports
// backpressure: how many events the server dropped for this subscriber because
// it could not keep up (cumulative). The collector is never blocked by a slow
// consumer — events are dropped and counted instead.
message StreamMeta {
  uint64 dropped = 1;
  // Set on the handshake meta only; nil on backpressure notices.
  TargetInfo target = 2;
}

// SubscribeResponse is one item in the stream: either a captured Event or a
// StreamMeta backpressure notice.
message SubscribeResponse {
  oneof kind {
    Event event = 1;
    StreamMeta meta = 2;
  }
}

// ResolveStackRequest asks the server to symbolize a stack id referenced by an
// event (Event.stack.stack_id, HeapCallSite.stack_id or LockEntry.stack_id).
// The id is only valid for the build identified by the accompanying
// StackRef.build_id, and is namespaced per capturing tracer — pass back exactly
// the value the event carried, never a bare kernel id.
message ResolveStackRequest {
  uint64 stack_id = 1;
  // The process the stack was captured in (#72). Kernel stack maps are
  // per-target, so the same id means different stacks in different processes:
  // required on an on-demand server, and on a fixed-target server it must be 0
  // or the server's own pid.
  int32 pid = 2;
}

// ResolveStackResponse returns the leaf-first symbolized frames for the stack
// id. found is false when the id is unknown — evicted from the kernel stack
// map, never captured, or symbolization is unavailable on the server.
message ResolveStackResponse {
  repeated StackFrame frames = 1;
  bool found = 2;
}

// EventStreamService is ptop's headless collection surface. ptop runs with the
// elevated capabilities (CAP_BPF/CAP_PERFMON); subscribers connect with none.
service EventStreamService {
  // Subscribe streams collector events for the requested target until the
  // client disconnects. The first response is always a StreamMeta carrying
  // TargetInfo, so a consumer knows the scope of what follows. Multiple
  // subscribers of one target fan out from a single set of collectors; an
  // on-demand server starts a target's collectors for its first subscriber and
  // releases them when the last one disconnects.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // ResolveStack symbolizes a stack id seen on the stream into its leaf-first
  // frames — an out-of-band lookup so high-rate events stay small (they carry
  // only the id). Resolution is best-effort; see ResolveStackResponse.found.
  rpc ResolveStack(ResolveStackRequest) returns (ResolveStackResponse);
}
