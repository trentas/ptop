version: 2

project_name: ptop

before:
  hooks:
    - go mod tidy

builds:
  # Single Linux build with embedded eBPF programs. ptop targets Linux
  # exclusively (eBPF, /proc, kernel tracepoints) — no other OS is supported.
  - id: ptop
    main: ./cmd/ptop
    binary: ptop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    tags:
      - ebpf
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .Date }}

  # macOS Tier 1: collectors go through libproc + Mach, so these need cgo and
  # must be built on a macOS host. The eBPF tag is irrelevant here — the
  # `!linux || !ebpf` stubs are selected on darwin either way.
  - id: ptop-darwin
    main: ./cmd/ptop
    binary: ptop
    env:
      - CGO_ENABLED=1
      - "CC={{ if eq .Arch \"amd64\" }}clang -arch x86_64{{ else }}clang{{ end }}"
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .Date }}

archives:
  - id: ptop
    ids: [ptop, ptop-darwin]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

# Homebrew on Linux does install casks, as long as no artifact is in
# MACOS_ONLY_ARTIFACTS — a lone `binary` stanza qualifies. That makes a cask
# the supported route here, since goreleaser deprecated `brews`. No macOS
# quarantine hook: this cask never lands on macOS.
homebrew_casks:
  - name: ptop
    binaries: [ptop]
    ids: [ptop]
    repository:
      owner: trentas
      name: homebrew-tap
      branch: main
      # SSH deploy key scoped write-only to the tap. GITHUB_TOKEN cannot write
      # to another repository, and a PAT with `repo` scope would reach them all.
      git:
        url: ssh://git@github.com/trentas/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
        ssh_command: ssh -i {{ .KeyPath }} -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -F /dev/null
    homepage: https://github.com/trentas/ptop
    description: "Interactive TUI for deep inspection of Linux processes via eBPF"
    license: mit
    commit_author:
      name: Fabio Wakim Trentini
      email: trentas@users.noreply.github.com
    # Without this, `brew install` on macOS finds no url/sha256 (the cask only
    # carries an on_linux block) and dies with a Ruby backtrace telling the user
    # to file a bug. Declaring the requirement turns that into a clean
    # "This cask requires Linux." — Homebrew keys it off depends_on at the top
    # level of the cask, which is exactly where goreleaser puts custom_block.
    # The release binaries are unsigned, so Gatekeeper quarantines them on
    # download and the first launch stalls in an XProtect assessment. Strip it
    # from the whole staged path: Homebrew sets the attribute on the directory
    # too, and leaving it there is enough to poison the assessment. The xattr probe keeps this a no-op on Linux,
    # where the same cask installs but /usr/bin/xattr does not exist.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end
    caveats: |
      Run as root: sudo ptop -pid <PID>

      On Linux, all panels are backed by eBPF. On macOS, collectors fall back
      to libproc + Mach ("Tier 1"): syscalls (F2), per-file I/O latency (F5)
      and the lock graph (F7) have no kernel equivalent and stay empty. ptop
      prints which tier it is running in on startup.

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:.*$"
      order: 1
    - title: "Collectors"
      regexp: "^.*collector[(\\w)]*:.*$"
      order: 2
    - title: "TUI"
      regexp: "^.*tui[(\\w)]*:.*$"
      order: 3
    - title: "Infra"
      regexp: "^.*infra[(\\w)]*:.*$"
      order: 4
    - title: "Other"
      order: 99

release:
  github:
    owner: trentas
    name: ptop
  name_template: "ptop {{ .Version }}"
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## ptop {{ .Version }}

    Linux binaries (amd64 / arm64) with eBPF collectors embedded.
    Requires kernel 5.8+ with BTF, and either root or `CAP_BPF + CAP_PERFMON`.

    ### Integrity verification

    ```bash
    sha256sum -c SHA256SUMS
    ```

    ### Installation

    ```bash
    curl -L https://github.com/trentas/ptop/releases/download/{{ .Tag }}/ptop-{{ .Version }}-linux-amd64.tar.gz | tar xz
    sudo install ptop /usr/local/bin/
    sudo ptop --pid <PID>
    ```
