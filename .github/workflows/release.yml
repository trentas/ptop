name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── eBPF objects ─────────────────────────────────────────────────────────
  # The .bpf.c programs compile against Linux kernel headers, so this is the
  # only place they can be built. They are embedded into the Linux binary via
  # go:embed and handed to the release job as an artifact.
  bpf:
    name: compile eBPF objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libbpf-dev \
            linux-tools-common \
            linux-tools-generic

      - name: make gen (compile .bpf.c → .bpf.o)
        run: make gen

      - uses: actions/upload-artifact@v4
        with:
          name: bpf-objects
          path: internal/bpf/programs/*.o
          if-no-files-found: error
          retention-days: 1

  # ─── Release ──────────────────────────────────────────────────────────────
  # Runs on macOS because the darwin binaries need cgo against libproc, and no
  # cross-compiler for that exists on a Linux runner. The Linux binaries stay
  # CGO_ENABLED=0, so a macOS host cross-compiles them with no extra toolchain.
  goreleaser:
    name: goreleaser (macOS host — builds linux + darwin)
    needs: bpf
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser uses git history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: bpf-objects
          path: internal/bpf/programs

      # go:embed fails at compile time on a missing file, but an empty or
      # truncated object would only surface at runtime on a user's machine.
      - name: verify the eBPF objects arrived
        run: |
          ls -l internal/bpf/programs/*.o
          for o in internal/bpf/programs/*.bpf.o; do
            test -s "$o" || { echo "empty eBPF object: $o"; exit 1; }
          done

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # Publishes the release itself.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the refreshed cask to trentas/homebrew-tap over SSH.
          # GITHUB_TOKEN cannot write to another repository; this is a deploy
          # key scoped write-only to the tap, so a leak cannot reach any other
          # repo. Rotate with:
          #   ssh-keygen -t ed25519 -f k -N ''
          #   gh api repos/trentas/homebrew-tap/keys -f key="$(cat k.pub)" -F read_only=false
          #   gh secret set HOMEBREW_TAP_DEPLOY_KEY --repo trentas/ptop < k
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
