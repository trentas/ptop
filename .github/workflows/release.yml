name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser uses git history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # eBPF toolchain — required to compile the .bpf.c programs that
      # goreleaser embeds in the binary via `-tags=ebpf`.
      - name: install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libbpf-dev \
            linux-tools-common \
            linux-tools-generic

      - name: make gen (compile .bpf.c → .bpf.o)
        run: make gen

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # Publishes the release itself.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the refreshed cask to trentas/homebrew-tap over SSH.
          # GITHUB_TOKEN cannot write to another repository; this is a deploy
          # key scoped write-only to the tap, so a leak cannot reach any other
          # repo. Rotate with:
          #   ssh-keygen -t ed25519 -f k -N ''
          #   gh api repos/trentas/homebrew-tap/keys -f key="$(cat k.pub)" -F read_only=false
          #   gh secret set HOMEBREW_TAP_DEPLOY_KEY --repo trentas/ptop < k
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
